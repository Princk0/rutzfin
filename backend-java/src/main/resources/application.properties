# ── PostgreSQL connection (read from environment variables) ──────────────────
# Format: jdbc:postgresql://<host>:<port>/<database>
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ─────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8000}

# ── Jackson: serialize dates as ISO-8601 strings (not epoch milliseconds) ───
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Static resources: serve Vite build from classpath:/static/ ───────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
